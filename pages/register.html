<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Анисимов: Регистрация</title>
</head>
<body>
    <header>Персональный сайт Анисимова Данила
    <p>
    <a href="../index.html">Главная</a>
    <a href="../pages/news.html">Новости</a>
    <a href="../pages/personal.html">Личный кабинет</a>
    <a href="../pages/works/work.html">Мои работы</a>
    <a href="../pages/login.html">Войти</a>
    <a href="../pages/register.html">Регистрация</a>
    </p>
    </header>
    <main>
        <h2>Регистрация</h2>

        <form method="post" action="#">
            <p>
                <label for="last-name">Фамилия:</label>
                <input type="text" id="last-name" name="last_name" required>
            </p>

            <p>
                <label for="first-name">Имя:</label>
                <input type="text" id="first-name" name="first_name" required>
            </p>

            <p>
                <label for="middle-name">Отчество:</label>
                <input type="text" id="middle-name" name="middle_name">
            </p>

            <p>
                <label for="user-email">Email:</label>
                <input type="email" id="user-email" name="email" placeholder="example@mail.ru" required>
            </p>

            <p>
                <label for="birth-date">Дата рождения:</label>
                <input type="date" id="birth-date" name="birth_date" required>
            </p>

            <p>
                <label for="reg-password">Пароль:</label>
                <input type="password" id="reg-password" name="password" required>
            </p>

            <p>
                <label for="confirm-password">Подтверждение пароля:</label>
                <input type="password" id="confirm-password" name="password_confirm" required>
            </p>

            <p>
                <input type="checkbox" id="personal-data" name="agree" required>
                <label for="personal-data">Согласен на обработку персональных данных</label>
            </p>

            <p>
                <button type="submit">Зарегистрироваться</button>
            </p>
        </form>
    </main>
    <footer>Сайт разработан Анисимовым Данилом © Все права защищены</footer>
</body>
</html>
